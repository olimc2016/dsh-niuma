# 推 tag 即自动发布到 npm（Trusted Publishing / OIDC，无需任何 token）
#
# 首次使用前，需要在 npm 包设置里绑定一次 Trusted Publisher：
#   https://www.npmjs.com/package/dsh-niuma/access
#   → Trusted Publisher → GitHub Actions
#     Organization or user: olimc2016
#     Repository:            dsh-niuma
#     Workflow filename:     publish.yml
#     Environment:           （留空）
#     Allowed actions:       （可留空；stage publish 不需要它。只有想 CI 直接发版才勾 npm publish）
#
# 也可以在本机登录 npm 后执行一次：
#   npm trust github dsh-niuma --repository olimc2016/dsh-niuma --file publish.yml
#
# 发版模式（本仓库默认 A）：
#   A. 自动直发（默认）：推 tag → CI 用 OIDC 直接 `npm publish --provenance` 上线，**无需人工批准**。
#      绑定页必须勾选 “Allow npm publish”。
#   B. 暂存后人工批：手动 Run workflow 选 mode=stage，到 npm 网页 Staged Packages 点 Approve。
name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: 'stage = 提交到暂存区（你到 npmjs.com 点 Approve）；publish = 直接上线（绑定页要勾 allow npm publish）'
        type: choice
        options:
          - stage
          - publish
        default: stage

permissions:
  contents: read
  id-token: write # OIDC 换取 npm 发布凭据，必需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: 用最新 npm（stage publish 需要 npm >= 11.5）
        run: npm install -g npm@latest

      - name: Install dev dependencies
        run: npm install --registry=https://registry.npmjs.org/ --ignore-scripts --no-audit --no-fund

      - name: Build client bundle
        run: npm run build

      - name: Built artifact must match committed source
        run: git diff --exit-code -- lib/client.js lib/client.js.map

      - name: Test
        run: npm test

      # 口径（2026-10 实测）：
      #   - npm 绑定页的 “Allowed actions” 只有 `npm publish` 一项（没有 stage）；
      #   - `npm stage publish` 不需要该授权就能用（暂存不改线上内容）；
      #   - 本仓库默认**推 tag 直接发布**（绑定页需勾 “Allow npm publish”），发布带 provenance；
      #   - 想改成「暂存 + 人工批」：手动 Run workflow 选 mode=stage，或把下面默认分支对调。
      - name: Publish directly (provenance, 需绑定页允许 npm publish)
        if: github.event_name == 'push' || inputs.mode == 'publish'
        run: npm publish --provenance --access public

      - name: Stage only (manual approval on npmjs.com)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'stage'
        run: npm stage publish --provenance --access public
