# 推 tag 即自动发布到 npm（Trusted Publishing / OIDC，无需任何 token）
#
# 首次使用前，需要在 npm 包设置里绑定一次 Trusted Publisher：
#   https://www.npmjs.com/package/dsh-niuma/access
#   → Trusted Publisher → GitHub Actions
#     Organization or user: olimc2016
#     Repository:            dsh-niuma
#     Workflow filename:     publish.yml
#     Environment:           （留空）
#
# 也可以在本机登录 npm 后执行一次：
#   npm trust github dsh-niuma --repository olimc2016/dsh-niuma --file publish.yml
#
# 发版流程（暂存后由维护者在 npm 网页 Approve，批准前可 reject）：
#   改 package.json 版本号 → 提交 → git tag vX.Y.Z → git push origin vX.Y.Z
#   或 GitHub Actions 页面手动 Run workflow → 到 npm 网页审批暂存版本
name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC 换取 npm 发布凭据，必需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: 用最新 npm（stage publish 需要 npm >= 11.5）
        run: npm install -g npm@latest

      - name: Install dev dependencies
        run: npm install --registry=https://registry.npmjs.org/ --ignore-scripts --no-audit --no-fund

      - name: Build client bundle
        run: npm run build

      - name: Built artifact must match committed source
        run: git diff --exit-code -- lib/client.js lib/client.js.map

      - name: Test
        run: npm test

      - name: Stage publish (provenance, 待 npm 网页审批)
        run: npm stage publish --provenance --access public
