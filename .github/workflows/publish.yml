# 推 tag 即自动发布到 npm（Trusted Publishing / OIDC，无需任何 token）
#
# 首次使用前，需要在 npm 包设置里绑定一次 Trusted Publisher：
#   https://www.npmjs.com/package/dsh-niuma/access
#   → Trusted Publisher → GitHub Actions
#     Organization or user: olimc2016
#     Repository:            dsh-niuma
#     Workflow filename:     publish.yml
#     Environment:           （留空）
#     Allowed actions:       （可留空；stage publish 不需要它。只有想 CI 直接发版才勾 npm publish）
#
# 也可以在本机登录 npm 后执行一次：
#   npm trust github dsh-niuma --repository olimc2016/dsh-niuma --file publish.yml
#
# 发版流程（暂存后由维护者在 npm 网页 Approve，批准前可 reject）：
#   改 package.json 版本号 → 提交 → git tag vX.Y.Z → git push origin vX.Y.Z
#   或 GitHub Actions 页面手动 Run workflow → 到 npm 网页审批暂存版本
name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: 'stage = 提交到暂存区（你到 npmjs.com 点 Approve）；publish = 直接上线（绑定页要勾 allow npm publish）'
        type: choice
        options:
          - stage
          - publish
        default: stage

permissions:
  contents: read
  id-token: write # OIDC 换取 npm 发布凭据，必需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: 用最新 npm（stage publish 需要 npm >= 11.5）
        run: npm install -g npm@latest

      - name: Install dev dependencies
        run: npm install --registry=https://registry.npmjs.org/ --ignore-scripts --no-audit --no-fund

      - name: Build client bundle
        run: npm run build

      - name: Built artifact must match committed source
        run: git diff --exit-code -- lib/client.js lib/client.js.map

      - name: Test
        run: npm test

      # npm 的 Trusted Publisher 绑定页里 “Allowed actions” **只列 npm publish**（没有 stage 选项）：
      #   - `npm stage publish` 不需要任何 allow 就能用（npm 官方：暂存不要求授权 action）；
      #   - 想让推 tag 直接上线，才需要绑定页勾选 “npm publish”，并用手动触发 mode=publish。
      # 默认仍走暂存：tag 推送只暂存，由维护者在 npmjs.com 完成 2FA 批准。
      - name: Stage publish (provenance, 待 npm 网页审批)
        if: github.event_name == 'push' || inputs.mode == 'stage'
        run: npm stage publish --provenance --access public

      - name: Publish directly (needs binding to allow npm publish)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
        run: npm publish --provenance --access public
