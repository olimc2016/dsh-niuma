<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>设置区排版 · 第二版（短输入）</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f9;
    --layer1: #ffffff;
    --layer2: #f1f3f6;
    --border1: rgba(0,0,0,.10);
    --border: rgba(0,0,0,.16);
    --label: #1f2430;
    --label2: #5a6472;
    --label3: #8a94a6;
    --ground: rgba(0,0,0,.02);
    --gold-tint: #e7b84d;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #0c0f14;
    --layer1: #141922;
    --layer2: #1b222d;
    --border1: rgba(255,255,255,.09);
    --border: rgba(255,255,255,.16);
    --label: #e8edf5;
    --label2: #a8b3c4;
    --label3: #748093;
    --ground: rgba(255,255,255,.03);
    --gold-tint: #e7b84d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--label);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 26px 22px 60px;
  }
  .page-head {
    max-width: 1240px; margin: 0 auto 20px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 14px; flex-wrap: wrap;
  }
  .page-head h1 { font-size: 19px; margin: 0 0 3px; letter-spacing: -.2px; }
  .page-head p { margin: 0; color: var(--label3); font-size: 12.5px; }
  .btn-ghost {
    appearance: none; border: 1px solid var(--border1); background: var(--layer1);
    color: var(--label2); border-radius: 9px; padding: 6px 12px; font-size: 12.5px;
    font-family: inherit; cursor: pointer; font-weight: 600;
  }
  .grid {
    max-width: 1240px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 16px; align-items: start;
  }
  .variant { background: var(--ground); border: 1px solid var(--border1); border-radius: 15px; padding: 13px; }
  .variant-head { display: flex; align-items: baseline; gap: 8px; margin: 0 2px 9px; }
  .variant-tag {
    font-size: 11px; font-weight: 800; color: #3a2a05;
    background: linear-gradient(180deg,#f8dc86,#efc258 52%,#d99d2c);
    border-radius: 6px; padding: 1px 7px; letter-spacing: .4px;
  }
  .variant-head h2 { font-size: 13.5px; margin: 0; }
  .variant-head em { font-style: normal; color: var(--label3); font-size: 11.5px; }
  .panel {
    background: var(--layer1); border: 1px solid var(--border1);
    border-radius: 13px; padding: 12px 13px;
  }
  .panel-title {
    display: flex; align-items: center; gap: 6px;
    font-size: 12.5px; font-weight: 700; margin-bottom: 8px;
  }
  .panel-title::before { content: "▼"; font-size: 9px; color: var(--label2); }

  /* —— 所有控件都按内容定宽，绝不拉满 —— */
  input.txt, select.sel {
    min-height: 28px; padding: 4px 7px;
    border-radius: 7px; border: 1px solid var(--border);
    background: var(--layer2); color: var(--label);
    font: inherit; font-size: 12.5px; font-variant-numeric: tabular-nums;
    outline: none;
  }
  input.txt { width: 88px; }
  select.sel { width: 46px; padding: 4px 2px 4px 5px; cursor: pointer; }
  .unit { font-size: 10.5px; color: var(--label3); }
  .time { display: inline-flex; align-items: center; gap: 2px; }
  .time .colon { color: var(--label3); font-weight: 700; font-size: 12px; }
  .dash { color: var(--label3); font-size: 11px; margin: 0 2px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 8px; border-radius: 8px;
    border: 1px solid var(--border1); background: var(--layer2);
    font-size: 11.5px; color: var(--label2); cursor: pointer; white-space: nowrap;
  }
  .chip input { accent-color: var(--gold-tint); width: 13px; height: 13px; margin: 0; }
  .save {
    appearance: none; cursor: pointer; margin-left: auto;
    border: 1px solid color-mix(in srgb, var(--gold-tint) 72%, rgba(0,0,0,.18));
    color: #3a2a05;
    background: linear-gradient(180deg,#f8dc86 0%,#efc258 52%,#d99d2c 100%);
    border-radius: 8px; padding: 5px 16px; font-size: 12.5px; font-weight: 700;
    letter-spacing: .3px; font-family: inherit;
    box-shadow: 0 2px 9px color-mix(in srgb, var(--gold-tint) 34%, transparent), inset 0 1px 0 rgba(255,255,255,.45);
    text-shadow: 0 1px 0 rgba(255,255,255,.28);
  }

  /* E / H：行式（标签左，控件短）*/
  .rows { display: grid; gap: 2px; }
  .rows .row {
    display: flex; align-items: center; gap: 10px;
    min-height: 34px; padding: 3px 0; border-top: 1px solid var(--border1);
  }
  .rows .row:first-child { border-top: none; }
  .rows .rk { width: 64px; flex: 0 0 64px; font-size: 11.5px; color: var(--label3); }
  .rows .rv { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
  .actions { display: flex; align-items: center; gap: 10px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border1); }

  /* F：字段并排（标签在上，短控件）*/
  .flow { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 12px; }
  .flow + .flow { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border1); }
  label.f { display: grid; gap: 3px; }
  label.f > span { font-size: 10.5px; color: var(--label3); }
  .inline-ctrl { display: flex; align-items: center; gap: 5px; }

  /* G：单行管道（最紧凑）*/
  .pipe { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; }
  .pipe .key { font-size: 11px; color: var(--label3); }
  .pipe .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--border); margin: 0 2px; }
  .hint { max-width: 1240px; margin: 16px auto 0; color: var(--label3); font-size: 12px; }
  .hint b { color: var(--label2); }
</style>
</head>
<body data-theme="dark">
  <div class="page-head">
    <div>
      <h1>设置区排版 · 第二版（短输入）</h1>
      <p>按你的反馈把控件都收到内容宽度：月薪 88px、时间 46px/格、勾选 chip 同排。还是四个方案，选一个或组合。</p>
    </div>
    <div><button class="btn-ghost" id="themeBtn" type="button">切到浅色</button></div>
  </div>

  <div class="grid" id="grid"></div>

  <p class="hint">
    <b>短控件规格：</b>月薪输入 88px（4-6 位数够用）、小时/分钟各 46px、勾选 chip 内联；所有控件按内容定宽，不再铺满整行。
  </p>

<script>
  window.addEventListener('error', (event) => {
    const pre = document.createElement('pre');
    pre.textContent = 'JS ERROR: ' + event.message;
    document.body.appendChild(pre);
  });
  const HOURS = Array.from({ length: 24 }, (_, i) => String(i).padStart(2, '0'));
  const MINUTES = Array.from({ length: 60 }, (_, i) => String(i).padStart(2, '0'));

  function h(tag, attrs = {}, children = []) {
    const el = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
      if (key === 'class') el.className = value;
      else if (key === 'text') el.textContent = value;
      else if (key === 'html') el.innerHTML = value;
      else if (key.startsWith('on')) el.addEventListener(key.slice(2).toLowerCase(), value);
      else if (value !== undefined && value !== null) el.setAttribute(key, value);
    }
    for (const child of [].concat(children).flat(Infinity)) {
      if (child === null || child === undefined) continue;
      el.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
    }
    return el;
  }

  function money() {
    return h('div', { class: 'inline-ctrl' }, [
      h('input', { class: 'txt', value: '22000', inputmode: 'decimal', 'aria-label': '实收月薪' }),
      h('span', { class: 'unit', text: '元/月' }),
    ]);
  }

  function time(hour, minute, label) {
    const hSel = h('select', { class: 'sel', 'aria-label': (label || '时间') + ' 小时' },
      HOURS.map((v) => h('option', { value: v, text: v, selected: v === hour ? 'selected' : null })));
    const mSel = h('select', { class: 'sel', 'aria-label': (label || '时间') + ' 分钟' },
      MINUTES.map((v) => h('option', { value: v, text: v, selected: v === minute ? 'selected' : null })));
    return h('span', { class: 'time' }, [hSel, h('span', { class: 'colon', text: ':' }), mSel]);
  }

  function range(h1, m1, h2, m2, label) {
    return h('span', { class: 'time' }, [time(h1, m1, label), h('span', { class: 'dash', text: '–' }), time(h2, m2, label)]);
  }

  function toggle(label, checked) {
    return h('label', { class: 'chip' }, [
      h('input', { type: 'checkbox', checked: checked ? 'checked' : null }),
      h('span', { text: label }),
    ]);
  }

  function saveRow() {
    return h('div', { class: 'actions' }, [h('span', { style: 'flex:1 1 auto' }), h('button', { class: 'save', type: 'button' }, ['保存'])]);
  }

  function variant(tag, title, note, body) {
    return h('section', { class: 'variant' }, [
      h('div', { class: 'variant-head' }, [
        h('span', { class: 'variant-tag', text: tag }),
        h('h2', { text: title }),
        h('em', { text: note }),
      ]),
      h('div', { class: 'panel' }, [h('div', { class: 'panel-title' }, ['设置']), body, saveRow()]),
    ]);
  }

  /* E：行式（标签左 + 短控件） */
  function variantE() {
    const row = (key, val) => h('div', { class: 'row' }, [h('span', { class: 'rk', text: key }), h('div', { class: 'rv' }, [val])]);
    return variant('E', '行式短控件', '标签左对齐，控件都贴内容宽', [
      h('div', { class: 'rows' }, [
        row('实收月薪', money()),
        row('工作时间', [time('09', '00', '上班'), h('span', { class: 'dash', text: '–' }), time('18', '00', '下班')]),
        row('午休', [toggle('启用午休', true), toggle('午休算工时', false), range('12', '00', '13', '00', '午休')]),
      ]),
    ]);
  }

  /* F：字段并排（标签在上，短控件） */
  function variantF() {
    const field = (label, ctrl) => h('label', { class: 'f' }, [h('span', { text: label }), ctrl]);
    return variant('F', '字段并排', '三列短控件，第二行放午休', [
      h('div', { class: 'flow' }, [
        field('实收月薪', money()),
        field('上班时间', time('09', '00', '上班')),
        field('下班时间', time('18', '00', '下班')),
      ]),
      h('div', { class: 'flow' }, [
        field('午休', h('div', { class: 'inline-ctrl' }, [toggle('启用午休', true), toggle('午休算工时', false)])),
        field('午休时间', range('12', '00', '13', '00', '午休')),
      ]),
    ]);
  }

  /* G：单行管道（最紧凑） */
  function variantG() {
    return variant('G', '单行管道', '所有设置压成一两行，最省空间', [
      h('div', { class: 'pipe' }, [
        h('span', { class: 'key', text: '月薪' }), money(),
        h('span', { class: 'dot' }),
        h('span', { class: 'key', text: '上班' }), time('09', '00', '上班'), h('span', { class: 'dash', text: '–' }), time('18', '00', '下班'),
        h('span', { class: 'dot' }),
        h('span', { class: 'key', text: '午休' }), toggle('启用', true), toggle('算工时', false), range('12', '00', '13', '00', '午休'),
      ]),
    ]);
  }

  /* H：两行短输入（E 的变体：上下班一行，午休一行） */
  function variantH() {
    const row = (key, val) => h('div', { class: 'row' }, [h('span', { class: 'rk', text: key }), h('div', { class: 'rv' }, [val])]);
    return variant('H', '两行短输入', '每行一组，左边标签对齐', [
      h('div', { class: 'rows' }, [
        row('月薪', money()),
        row('上下班', [time('09', '00', '上班'), h('span', { class: 'dash', text: '–' }), time('18', '00', '下班')]),
        row('午休', [toggle('启用', true), range('12', '00', '13', '00', '午休'), toggle('算工时', false)]),
      ]),
    ]);
  }

  const grid = document.getElementById('grid');
  [variantE(), variantF(), variantG(), variantH()].forEach((el) => grid.appendChild(el));

  const themeBtn = document.getElementById('themeBtn');
  themeBtn.addEventListener('click', () => {
    const dark = document.body.getAttribute('data-theme') === 'dark';
    document.body.setAttribute('data-theme', dark ? 'light' : 'dark');
    themeBtn.textContent = dark ? '切到深色' : '切到浅色';
  });
</script>
</body>
</html>
